<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; frame-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Research manuscript</title>
  <link rel="stylesheet" href="style.css">
  <script src="viewer.js" defer></script>
</head>
<body>
  <main>
    <h1>Research manuscript</h1>
    <p id="status" role="status" aria-live="polite">Use the complete private link to open this manuscript.</p>
    <form id="unlock-form">
      <label for="access-key">Access key</label>
      <input id="access-key" type="password" autocomplete="off" spellcheck="false" required>
      <button type="submit">Open manuscript</button>
    </form>
    <nav id="actions" aria-label="Manuscript actions" hidden>
      <a id="open-pdf" target="_blank" rel="noopener noreferrer">Open PDF in a new tab</a>
      <a id="download-pdf" download="ICL-R-manuscript.pdf">Download PDF</a>
    </nav>
    <iframe id="preview" title="Manuscript PDF" hidden></iframe>
    <p class="note">Please do not redistribute this manuscript or its private link.</p>
    <noscript>JavaScript is required to unlock the encrypted manuscript in your browser.</noscript>
  </main>
</body>
</html>
